name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    env:
      APP_NAME: gossms
      MAIN_PACKAGE: ./cmd/gossms
      CGO_ENABLED: "0"
      # Placeholder only — the real value is set at runtime by the "Set
      # release version" step via $GITHUB_ENV. Declared here purely so
      # editor/linter static analysis recognizes env.VERSION as a known key.
      VERSION: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --abbrev=0)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Error: no Git tag found. Create a tag first, for example: git tag v0.0.2" >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Using release version: ${VERSION}"

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          COMMIT="${GITHUB_SHA:0:12}"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERSION_PKG="github.com/radix29/gossms/internal/version"

          # goSSMS only claims Linux/macOS/Windows support (see README.md) —
          # deliberately not the full `go tool dist list` matrix, some of
          # which (e.g. android/*) doesn't even build for this codebase.
          TARGETS=(
            "windows/amd64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"

            echo "Building ${APP_NAME} ${VERSION} for ${GOOS}/${GOARCH}"

            output_dir="dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "${output_dir}"

            binary_name="${APP_NAME}"
            if [ "${GOOS}" = "windows" ]; then
              binary_name="${APP_NAME}.exe"
            fi

            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 \
              go build \
                -trimpath \
                -ldflags "-s -w -X ${VERSION_PKG}.Version=${VERSION} -X ${VERSION_PKG}.Commit=${COMMIT} -X ${VERSION_PKG}.Date=${DATE}" \
                -o "${output_dir}/${binary_name}" \
                "${MAIN_PACKAGE}"

            if [ -f README.md ]; then
              cp README.md "${output_dir}/"
            fi

            if [ -f LICENSE ]; then
              cp LICENSE "${output_dir}/"
            fi

            if [ "${GOOS}" = "windows" ]; then
              (cd dist && zip -q -r "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.zip" "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}")
            else
              tar -C dist -czf "dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
            fi

            rm -rf "${output_dir}"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums with cosign
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: gossms ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Bump the Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    # Only a real tag has a published release to point the formula at; a
    # workflow_dispatch run would otherwise publish a formula whose URLs 404.
    if: github.ref_type == 'tag'

    steps:
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: radix29/homebrew-tap
          # GITHUB_TOKEN cannot write to another repository. This is the
          # private half of a write-enabled deploy key registered on
          # radix29/homebrew-tap ("gossms release workflow") — scoped to that
          # one repository, unlike a PAT, and it does not expire. ssh-key also
          # makes checkout set the remote to SSH, so the push below needs no
          # further credential.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Render Formula/gossms.rb
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Homebrew's version has no leading "v"; the release URLs and the
          # archive names do, so both spellings are needed below.
          VERSION="${TAG#v}"
          BASE="https://github.com/radix29/gossms/releases/download/${TAG}"

          # The release job published checksums.txt alongside the archives.
          # Reading it back (rather than re-hashing a local dist/) also proves
          # every asset the formula references is really downloadable.
          curl -fsSL -o checksums.txt "${BASE}/checksums.txt"

          # Resolved before the heredoc, never inside it: a command
          # substitution runs in a subshell, so an `exit 1` there would abort
          # only that subshell and `set -e` would not see it. A missing
          # checksum would render a formula with an empty sha256 field and
          # push it. Ask for every hash up front and fail here instead.
          sha_for() {
            local name="$1" sha
            sha="$(awk -v n="${name}" '$2 == n || $2 == "*" n { print $1 }' checksums.txt)"
            if [ ${#sha} -ne 64 ]; then
              echo "Error: no sha256 for ${name} in checksums.txt" >&2
              return 1
            fi
            printf '%s' "${sha}"
          }

          darwin_arm64="gossms_${TAG}_darwin_arm64.tar.gz"
          darwin_amd64="gossms_${TAG}_darwin_amd64.tar.gz"
          linux_arm64="gossms_${TAG}_linux_arm64.tar.gz"
          linux_amd64="gossms_${TAG}_linux_amd64.tar.gz"

          darwin_arm64_sha="$(sha_for "${darwin_arm64}")"
          darwin_amd64_sha="$(sha_for "${darwin_amd64}")"
          linux_arm64_sha="$(sha_for "${linux_arm64}")"
          linux_amd64_sha="$(sha_for "${linux_amd64}")"

          mkdir -p tap/Formula
          cat > tap/Formula/gossms.rb <<FORMULA
          # Generated by .github/workflows/release.yml in radix29/gossms.
          # Do not edit by hand — the next release overwrites this file.
          class Gossms < Formula
            desc "Terminal reimplementation of SQL Server Management Studio"
            homepage "https://github.com/radix29/gossms"
            version "${VERSION}"
            license "GPL-3.0-or-later"

            on_macos do
              on_arm do
                url "${BASE}/${darwin_arm64}"
                sha256 "${darwin_arm64_sha}"
              end
              on_intel do
                url "${BASE}/${darwin_amd64}"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/${linux_arm64}"
                sha256 "${linux_arm64_sha}"
              end
              on_intel do
                url "${BASE}/${linux_amd64}"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "gossms"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/gossms --version")
            end
          end
          FORMULA

          cat tap/Formula/gossms.rb

      - name: Commit and push
        shell: bash
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare against the index. `git diff` alone
          # reports no change for a file git has never tracked, so on the very
          # first release the guard below declared the formula "up to date"
          # and pushed nothing — the tap shipped with no Formula/ at all and
          # `brew install radix29/tap/gossms` 404'd for the whole v0.0.10
          # cycle. --cached sees a newly added file as a change.
          git add Formula/gossms.rb
          if git diff --cached --quiet -- Formula/gossms.rb; then
            echo "Formula already up to date for ${TAG}; nothing to push."
            exit 0
          fi

          git commit -m "gossms ${TAG}"
          git push

  apt:
    name: Publish the apt repository
    runs-on: ubuntu-latest
    needs: release
    # As with the tap: only a real tag has published assets to package.
    if: github.ref_type == 'tag'

    steps:
      - name: Check out the apt repository
        uses: actions/checkout@v4
        with:
          repository: radix29/apt
          # Write-enabled deploy key on radix29/apt; GITHUB_TOKEN cannot write
          # to another repository. ssh-key also points the remote at SSH, so
          # the push needs no further credential.
          ssh-key: ${{ secrets.APT_REPO_DEPLOY_KEY }}
          path: apt

      - name: Build the .deb packages
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          BASE="https://github.com/radix29/gossms/releases/download/${TAG}"

          mkdir -p debs
          curl -fsSL -o checksums.txt "${BASE}/checksums.txt"

          for arch in amd64 arm64; do
            archive="gossms_${TAG}_linux_${arch}.tar.gz"
            curl -fsSL -o "${archive}" "${BASE}/${archive}"

            # The release publishes checksums; a package built from an archive
            # that was not verified would launder a corrupted download into a
            # signed repository, which is the one thing signing is meant to
            # prevent.
            grep -F " ${archive}" checksums.txt | sha256sum -c -

            rm -rf "extract_${arch}"
            mkdir "extract_${arch}"
            tar -C "extract_${arch}" --strip-components=1 -xzf "${archive}"

            root="pkgroot_${arch}"
            rm -rf "${root}"
            mkdir -p "${root}/DEBIAN" "${root}/usr/bin" "${root}/usr/share/doc/gossms"

            install -m 0755 "extract_${arch}/gossms" "${root}/usr/bin/gossms"
            install -m 0644 "extract_${arch}/LICENSE" "${root}/usr/share/doc/gossms/copyright"

            # dpkg-deb --root-owner-group fixes ownership but not mode, and the
            # runner's umask leaves directories group-writable, which dpkg
            # flags. Set them explicitly.
            find "${root}" -type d -exec chmod 0755 {} +

            installed_size="$(du -sk "${root}/usr" | cut -f1)"

            cat > "${root}/DEBIAN/control" <<CONTROL
          Package: gossms
          Version: ${VERSION}
          Architecture: ${arch}
          Maintainer: radix29 <radu_colceriu@hotmail.com>
          Installed-Size: ${installed_size}
          Section: database
          Priority: optional
          Homepage: https://github.com/radix29/gossms
          Description: Terminal reimplementation of SQL Server Management Studio
           goSSMS is a portable, cross-platform terminal TUI reimplementation of
           SQL Server Management Studio. It connects to Microsoft SQL Server
           2016 SP1 and later, and offers an object explorer, a query editor
           with results grids, execution plans, and property sheets for server
           and database objects.
           .
           The binary is statically linked and has no runtime dependencies.
          CONTROL

          # The heredoc above is indented to match this YAML block; strip that
          # indentation back off so the control file is valid.
          sed -i 's/^          //' "${root}/DEBIAN/control"

            dpkg-deb --root-owner-group --build "${root}" \
              "debs/gossms_${VERSION}_${arch}.deb"
          done

          ls -l debs

      - name: Regenerate the repository indices
        shell: bash
        run: |
          set -euo pipefail

          cd apt
          mkdir -p pool/main/g/gossms
          cp ../debs/*.deb pool/main/g/gossms/

          # Every index is rebuilt from the whole pool, never appended to.
          # Packages lists every version apt may install, so an index carrying
          # only the newest entry would silently make older versions
          # uninstallable and break `apt-get install gossms=<old>`.
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-${arch}"
            dpkg-scanpackages --arch "${arch}" pool /dev/null \
              > "dists/stable/main/binary-${arch}/Packages"
            gzip -9kf "dists/stable/main/binary-${arch}/Packages"
          done

          python3 - <<'RELEASE'
          import datetime, hashlib, os

          base = "dists/stable"
          entries = []
          for root, _, names in os.walk(base):
              for name in names:
                  if name in ("Release", "InRelease", "Release.gpg"):
                      continue
                  path = os.path.join(root, name)
                  with open(path, "rb") as fh:
                      data = fh.read()
                  entries.append((os.path.relpath(path, base), len(data), data))

          out = ["""Origin: radix29
          Label: radix29 apt repository
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: goSSMS and other radix29 tools
          Date: {}
          """.format(
              datetime.datetime.now(datetime.UTC).strftime("%a, %d %b %Y %H:%M:%S UTC")
          ).replace("\n          ", "\n")]

          for algo, heading in (("md5", "MD5Sum"), ("sha256", "SHA256")):
              out.append("%s:\n" % heading)
              for rel, size, data in sorted(entries):
                  out.append(" %s %8d %s\n" % (hashlib.new(algo, data).hexdigest(), size, rel))

          with open(os.path.join(base, "Release"), "w") as fh:
              fh.write("".join(out))
          RELEASE

          cat dists/stable/Release

      - name: Sign the Release file
        shell: bash
        env:
          GPG_KEY: ${{ secrets.APT_REPO_GPG_KEY }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${GPG_KEY}" | gpg --batch --quiet --import

          cd apt/dists/stable
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --detach-sign --armor -o Release.gpg Release

          # Verify with gpgv against the published public key — exactly what
          # apt does on the client — so a broken signature fails here rather
          # than on every user's next `apt-get update`.
          gpg --dearmor < "${GITHUB_WORKSPACE}/apt/gossms.asc" > "${GNUPGHOME}/pub.gpg"
          gpgv --keyring "${GNUPGHOME}/pub.gpg" InRelease
          gpgv --keyring "${GNUPGHOME}/pub.gpg" Release.gpg Release

          rm -rf "${GNUPGHOME}"

      - name: Commit and push
        shell: bash
        working-directory: apt
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "Repository already up to date for ${TAG}; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gossms ${TAG}"
          git push
